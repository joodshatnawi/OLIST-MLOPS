services:

  postgres:
    image: postgres:16
    container_name: olist-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: olist-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - "postgresql://mlflow:mlflow@postgres:5432/mlflow"
      - --artifacts-destination
      - "file:///mlartifacts"
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:*"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist-api
    depends_on:
      mlflow:
        condition: service_started
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  mlflow_artifacts: